{% extends "../Base.html" %}
{% block title %}
    Edit Patient
{% endblock %}
{% block content %}
    <h1>Edit Patient</h1>
    <form method="post">
        {% csrf_token %}
        <p>
            Username:
            <input type="text" name="username" value="{{ patient.username }}" required>
        </p>
        <p>
            Email:
            <input type="email" name="email" value="{{ patient.email }}">
        </p>
        <button type="submit" class="btn btn-primary">Update Patient</button>
        <a href="{% url 'manage_patients' %}" class="btn btn-secondary">Back</a>
    </form>
{% endblock %}
