{%  extends "../Base.html"  %}

{% block title%}
Register
{% endblock %}

{%   block content %}

    <h1>Register</h1>

    <form method="post"
          action="{% url 'register' %}">

        {% csrf_token %}

        <p>
            Username:
            <input type="text"
                   name="username">
        </p>

        <p>
            Password:
            <input type="password"
                   name="password">
        </p>

        <p>
            Email:
            <input type="email"
                   name="email">
        </p>

        <button type="submit"
                class="btn btn-primary">
            Register
        </button>

    </form>

{% endblock %}
