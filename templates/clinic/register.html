{%  extends "../Base.html"  %}

{% block title%}
Register
{% endblock %}

{%   block content %}

    <h1>Register</h1>
    {% if error %}
    <div class="alert alert-danger">
    {{ error }}
    </div>
    {% endif %}
    <form method="post"
          action="{% url 'register' %}">

        {% csrf_token %}

        <p>
            Username:
            <input type="text"
                   name="username">
        </p>

        <p>
            Password:
            <input type="password"
                   name="password">
        </p>

        <p>
            Email:
            <input type="email"
                   name="email">
        </p>

        <button type="submit"
                class="btn btn-primary">
            Register
        </button>

    </form>

{% endblock %}
