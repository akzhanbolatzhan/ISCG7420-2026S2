{% extends "../Base.html" %}
{% block title %}
    Delete Patient
{% endblock %}
{% block content %}
    <h1>Delete Patient</h1>
    <p>Are you sure you want to delete this patient account?</p>
    <div class="card mb-3">
        <div class="card-body">
            <h5>{{ patient.username }}</h5>
            <p>
                Email:
                {{ patient.email }}
            </p>
            <p>
                Date Joined:
                {{ patient.date_joined }}
            </p>
        </div>
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete Patient</button>
        <a href="{% url 'manage_patients' %}" class="btn btn-secondary">Back</a>
    </form>
{% endblock %}
