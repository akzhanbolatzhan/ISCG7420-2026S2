{% extends "../Base.html" %}

{% block title %}
    Edit Doctor
{% endblock %}


{% block content %}

    <h1>Edit Doctor</h1>

    <form method="post">

        {% csrf_token %}

        <p>
            Name:
            <input type="text"
                   name="name"
                   value="{{ doctor.name }}"
                   required>
        </p>

        <p>
            Specialty:
            <input type="text"
                   name="specialty"
                   value="{{ doctor.specialty }}"
                   required>
        </p>

        <p>
            Bio:
            <textarea name="bio"
                      rows="5"
                      cols="50">{{ doctor.bio }}</textarea>
        </p>

        <button type="submit"
                class="btn btn-primary">
            Update Doctor
        </button>

        <a href="{% url 'manage_doctors' %}"
           class="btn btn-secondary">
            Back
        </a>

    </form>

{% endblock %}
