{% extends "../Base.html" %}
{% block title %}
    Add Appointment Slot
{% endblock %}
{% block content %}
    <h1>Add Appointment Slot</h1>
    <form method="post" action="{% url 'add_appointment_slot' %}">
        {% csrf_token %}
        <p>
            Doctor:
            <select name="doctor" required>
                {% for doctor in doctors %}
                    <option value="{{ doctor.id }}">{{ doctor.name }} - {{ doctor.specialty }}</option>
                {% endfor %}
            </select>
        </p>
        <p>
            Date:
            <input type="date" name="date" required>
        </p>
        <p>
            Time:
            <input type="time" name="time" required>
        </p>
        <button type="submit" class="btn btn-success">Add Appointment Slot</button>
        <a href="{% url 'manage_appointment_slots' %}" class="btn btn-secondary">Back</a>
    </form>
{% endblock %}
