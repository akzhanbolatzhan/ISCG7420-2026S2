<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>
        {% block title %}
            Piki Ora Medical Centre
        {% endblock %}
    </title>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">

        <div class="container-fluid">

            <a class="navbar-brand"
               href="{% url 'home' %}">
                Piki Ora
            </a>
            <div class="navbar-nav">
                <a class="nav-link"
                   href="{% url 'home' %}">
                    Home
                </a>


                <a class="nav-link"
                   href="{% url 'doctors' %}">
                    Doctors
                </a>
                {% if not user.is_authenticated %}

                    <a class="nav-link"
                       href="{% url 'login' %}">
                        Login
                    </a>

                    <a class="nav-link"
                       href="{% url 'register_form' %}">
                        Register
                    </a>
                {% else %}

                    {% if user.is_staff %}

                        <a class="nav-link"
                           href="{% url 'dashboard' %}">
                            Dashboard
                        </a>

                    {% else %}

                        <a class="nav-link"
                           href="{% url 'my_appointments' %}">
                            My Appointments
                        </a>

                    {% endif %}


                    <span class="navbar-text me-3">
                        {{ user.username }}
                    </span>

                    <form method="post"
                          action="{% url 'logout' %}">

                        {% csrf_token %}

                        <button type="submit"
                                class="btn btn-outline-danger">
                            Logout
                        </button>
                    </form>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>
</body>
</html>
